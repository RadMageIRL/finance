# Builds RadMage Finance and deploys it to GitHub Pages, where radmagelabs.com/finance/ serves it
# through the RadMage Labs site. It runs only by hand (Actions tab, "Run workflow", or
# `gh workflow run pages.yml`), so a push never publishes by accident. Needs the repository's
# Pages source set to "GitHub Actions". The full local check (`npm run check`) is the release gate;
# this workflow repeats the unit tests and the built-output checks before deploying.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: Production build
        run: npm run build
      - name: Built-output checks (links, origins, metadata, sitemap, weight)
        run: node tools/dist-check.mjs
      # The same commit builds the same files in the same calendar month, so this list can be
      # compared with `node tools/dist-manifest.mjs` run on a local build of the same commit.
      - name: SHA-256 of every deployed file
        run: node tools/dist-manifest.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
